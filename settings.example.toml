# AutoTrading 7s 엔진 설정 예시 — 이 파일을 `settings.toml` 로 복사해 쓴다.
#
#   cp settings.example.toml settings.toml
#   python -m autotrading7s.cli --env mock --settings settings.toml --simulate 10000,9500 --status
#
# 알 수 없는 키는 거부된다. 오타난 키가 조용히 무시되면 한도를 설정했다고
# 믿은 채로 다른 값으로 돌게 되기 때문이다(`app/settings.py`).
# 모든 값은 양의 정수여야 한다.

[engine]

# 전체 총투입 한도(원). **기본값이 없다 — 반드시 적어야 한다.**
# 이 프로그램은 설계상 자동 손절매를 하지 않으므로(설계서 6절), 총한도가
# 제공되는 유일한 구조적 보호장치다. 기본값이 조용히 적용되는 것은 무한
# 물타기를 묵인하는 것이다. 종목별 한도는 종목 설정에서 따로 정한다.
total_limit = 21000000

# 미체결 주문을 취소하고 다음 틱에 재판정할 때까지의 대기(초). 설계서 9절 ⑥.
# 유동성이 낮은 종목에서는 더 길어야 할 수 있다.
pending_timeout_sec = 3

# 잔고 대사 주기(초). 설계서 10.2절. 내부 기록이 실계좌보다 많으면(INTERNAL_MORE)
# 그 사이클을 자동 정지시키는 것이 이 주기의 역할이며, 자동 보정은 하지 않는다(D13).
reconcile_interval_sec = 300

# 분당 최대 주문 수. 증권사 호출 제한과 폭주 방지용 안전장치.
max_orders_per_minute = 10

# 매도된 단계가 다시 매수 대상이 될 때까지의 쿨다운(초). 설계서 5절 규칙 3.
# 종목 설정의 값이 있으면 그것이 우선한다.
rebuy_cooldown_sec = 60
